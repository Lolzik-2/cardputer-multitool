name: Build Cardputer Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build Firmware
        run: pio run -e cardputer_adv

      - name: Merge Binaries into Single File
        run: |
          BUILD_DIR=".pio/build/cardputer_adv"
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)
          echo "Found boot_app0.bin at: $BOOT_APP0"
          
          pip install esptool
          
          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            -o "$BUILD_DIR/firmware-merged.bin" \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-firmware
          if-no-files-found: error
          path: |
            .pio/build/cardputer_adv/firmware.bin
            .pio/build/cardputer_adv/firmware-merged.bin
            .pio/build/cardputer_adv/bootloader.bin
            .pio/build/cardputer_adv/partitions.bin
